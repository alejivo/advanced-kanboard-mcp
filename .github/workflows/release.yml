name: Release

# Every push to master publishes a GitHub release whose asset is
# ModelContextProtocol-<version>.zip. If Plugin.php is still the version
# of the latest vX.Y.Z tag, the patch number is increased on
# chore/release-<version> and merged to master through a pull request.
# Direct pushes to master are rejected by the branch ruleset. If the
# merged branch already raised Plugin.php above that tag, that version
# is published as-is.

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Publish the next release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh
