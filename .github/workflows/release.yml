name: Release

# A push to master publishes ModelContextProtocol-<version>.zip when
# the plugin archive changes. Documentation-only pushes do not start
# this workflow. If Plugin.php is still the version of the latest
# vX.Y.Z tag, the patch is increased on chore/release-<version> and
# merged through a pull request. If the merged branch already raised
# Plugin.php above that tag, that version is published as-is.

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Publish the next release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh
