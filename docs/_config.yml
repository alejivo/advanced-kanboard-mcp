title: Advanced Kanboard MCP
description: An MCP that connects autonomous agents to specific Kanboard boards, with granular access.
theme: just-the-docs

url: https://alejivo.github.io
baseurl: /advanced-kanboard-mcp

permalink: pretty
color_scheme: kanboard

aux_links:
  Repository:
    - https://github.com/alejivo/advanced-kanboard-mcp
aux_links_new_tab: true

nav_enabled: true
heading_anchors: true
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 8
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: "k"

enable_copy_code_button: true
back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Advanced Kanboard MCP connects autonomous agents to specific Kanboard boards.

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/alejivo/advanced-kanboard-mcp"
gh_edit_branch: "master"
gh_edit_source: docs
gh_edit_view_mode: "tree"

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  quiet_deps: true
  silence_deprecations: ["import"]

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .bundle/
  - vendor/
  - Gemfile
  - Gemfile.lock
